<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ | Body Scent Admin</title>
  <link rel="stylesheet" href="style.css">

  <!-- Page-specific touches (can be moved into style.css later) -->
  <style>
    .page-title h1 { font-size: var(--text-2xl); }

    .table-wrap {
      overflow-x: auto;
      background: var(--white);
      border: var(--line-soft);
      border-radius: var(--radius);
    }
    #ordersTable {
      width: 100%;
      min-width: 860px;
      border-collapse: collapse;
      font-size: var(--text-sm);
      line-height: 1.7;
    }
    #ordersTable th,
    #ordersTable td {
      padding: var(--space-2) var(--space-3);
      text-align: left;
      vertical-align: top;
      border-bottom: var(--line-soft);
    }
    #ordersTable thead th {
      font-weight: 400;
      color: var(--beige-dark);
      border-bottom: var(--line);
      white-space: nowrap;
    }
    #ordersTable tbody tr:last-child td { border-bottom: 0; }
    #ordersTable tbody tr:hover { background: var(--cream); }
    #ordersTable th:nth-child(5),
    #ordersTable td:nth-child(5) { text-align: right; white-space: nowrap; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Body Scent</a>
      <ul class="nav">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">

        <div class="section-head page-title">
          <h1>รายการสั่งซื้อ</h1>
          <span class="rule"></span>
          <p class="lead">เรียงจากรายการล่าสุดก่อน</p>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th>วันเวลา</th>
                <th>ชื่อลูกค้า</th>
                <th>เบอร์โทร/Line</th>
                <th>รายการสินค้า</th>
                <th>จำนวนเงินรวม</th>
                <th>หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="logo">Body Scent</span>
      <small>&copy; 2026 Body Scent</small>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
