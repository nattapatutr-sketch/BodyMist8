<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Body Scent</title>
  <link rel="stylesheet" href="style.css">

  <!-- Page-specific touches (can be moved into style.css later) -->
  <style>
    .page-title h1 { font-size: var(--text-2xl); }
    .order-form { max-width: 560px; margin-inline: auto; }
    .order-form textarea { resize: vertical; min-height: 3.5rem; line-height: 1.7; }
    .order-form .btn { margin-top: var(--space-2); }
    .order-help { margin: var(--space-4) auto 0; text-align: center; font-size: var(--text-sm); }
    .order-help a { border-bottom: 1px solid var(--gold); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Body Scent</a>
      <ul class="nav">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">

        <div class="section-head page-title">
          <h1>สั่งซื้อสินค้า</h1>
          <span class="rule"></span>
          <p class="lead">กรอกข้อมูลเพื่อยืนยันคำสั่งซื้อของคุณ</p>
        </div>

        <form id="orderForm" class="order-form">

          <div class="form-row">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="form-row">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="form-row">
            <label for="items">รายการสินค้า</label>
            <textarea id="items" name="items" rows="2" required></textarea>
          </div>

          <div class="form-row">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="number" id="total" name="total" min="0" step="any" inputmode="decimal" required>
          </div>

          <div class="form-row">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" rows="3"></textarea>
          </div>

          <button type="submit" class="btn btn--solid btn--block">ยืนยันสั่งซื้อ</button>

        </form>

        <p class="order-help text-muted">
          ยังไม่ได้เลือกสินค้า? <a href="product.html">ดูสินค้าทั้งหมด</a>
        </p>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="logo">Body Scent</span>
      <ul class="nav">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
      </ul>
      <small>&copy; 2026 Body Scent</small>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
